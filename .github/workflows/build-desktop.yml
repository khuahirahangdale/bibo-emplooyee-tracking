name: Build Desktop App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @ctracking/desktop build

      - name: Build Tauri desktop executable
        run: pnpm tauri build --no-bundle
        working-directory: apps/desktop

      - name: Upload compiled binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctracking-windows-exe
          path: apps/desktop/src-tauri/target/release/ctracking.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/ctracking.exe
          tag_name: ${{ github.ref_name }}
          name: BiBo Tracker ${{ github.ref_name }}
          body: "Official desktop client build for employee tracking."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}